name: CurseForge stats

# Updates data/curseforge.json (download counts on the home page).
# The API key is the repository secret CF_API_KEY — it is never part of the website.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/curseforge_stats.py
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
      - name: Commit if the numbers changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curseforge.json
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "chore: update CurseForge stats"
            git pull --rebase
            git push
          fi
