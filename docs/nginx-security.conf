# Security headers for maximilianstickel.de
# Paste these lines into the `server { ... }` block for maximilianstickel.de (port 443)
# in /etc/nginx/sites-available/<your-site>, then run:  sudo nginx -t && sudo systemctl reload nginx

# Hide the nginx version
server_tokens off;

# Only allow scripts/styles/images/connections the site actually uses (blocks injected code / XSS)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org https://www.themoviedb.org https://ghchart.rshah.org; font-src 'self'; connect-src 'self' https://api.themoviedb.org https://raw.githubusercontent.com https://api.emailjs.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
# Always use HTTPS (one year)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Don't let other sites embed the page (clickjacking)
add_header X-Frame-Options "DENY" always;
# Don't guess file types
add_header X-Content-Type-Options "nosniff" always;
# Send only the domain, not the full URL, to other sites
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The site needs no camera, microphone, location, …
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Never serve hidden files (.git, .env, …) even if they get uploaded by accident.
# /.well-known stays reachable: Let's Encrypt needs it to renew the HTTPS certificate.
location ~ /\.(?!well-known) {
    deny all;
    return 404;
}
