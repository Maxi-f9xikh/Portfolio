<body>

        <p class="codedby">© coded by Maximilian Stickel</p>

            <div class="nav-item"><a href="index.html">Home</a></div>

                <div class="nav-item">
                    <img src="images/Darkmode.png" alt="Darkmode an machen?" class="nav-item">

    </header>

    <br>
    <hr>

    <main>
        <div class="Kontakt-container">
            <h1 class="Kontakt-title">Kontaktiere mich</h1>

            <div class="Kontakt-form">
                <div class="form">
                    <label for="name">Dein Name:</label>
                    <input type="text" id="name" placeholder="Vollen Namen eingeben" required>
                </div>

                <div class="form">
                    <label for="email">Deine Email:</label>
                    <input type="email" id="email" placeholder="Email eingeben" required>
                </div>

                <div class="form">
                    <label for="message">Deine Nachricht:</label>
                    <textarea id="message" placeholder="Nachricht eingeben" rows="5" required></textarea>
                </div>

                <button type="button" class="senden-btn" id="send-btn" onclick="sendEmail()">
                    Nachricht senden
                </button>
                <p id="form-status"></p>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <p class="footer-copy">© 2026 Maximilian Stickel. All Rights Reserved.</p>
            <a href="https://buymeacoffee.com/Maxi1" target="_blank" rel="noopener noreferrer" class="footer-coffee">
                <img src="images/bmacoffe.png" alt="buy me a coffe! " class="coffee-bild">
            </a>
            <div class="footer-links">
                <a href="impressum.html">Impressum</a>
                <a href="datenschutz.html">Datenschutz</a>
            </div>
        </div>
    </footer>

    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="js/index.js"></script>
    <script>


        const EMAILJS_PUBLIC_KEY  = 'k2jTJt4fLlSKf3Axl';   // ← hier eintragen
        const EMAILJS_SERVICE_ID  = 'service_qz8ek5o';  // ← hier eintragen
        const EMAILJS_TEMPLATE_ID = 'template_ely5dtl'; // ← hier eintragen

        emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

        function sendEmail() {
            const name    = document.getElementById('name').value.trim();
            const email   = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();
            const status  = document.getElementById('form-status');
            const btn     = document.getElementById('send-btn');

            if (!name || !email || !message) {
                status.style.color = '#FF901F';
                status.textContent = 'Bitte alle Felder ausfüllen.';
                return;
            }

            btn.disabled    = true;
            btn.textContent = 'Wird gesendet…';
            status.textContent = '';

            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                from_name:  name,
                from_email: email,
                message:    message,
                to_email:   'red7creeeper@gmail.com'
            }).then(() => {
                status.style.color = '#048017';
                status.textContent = '✓ Nachricht erfolgreich gesendet!';
                btn.textContent    = 'Nachricht senden';
                btn.disabled       = false;
                document.getElementById('name').value    = '';
                document.getElementById('email').value   = '';
                document.getElementById('message').value = '';
            }).catch((err) => {
                console.error('EmailJS Fehler:', err);
                status.style.color = '#cc0000';
                status.textContent = 'Fehler beim Senden. Bitte versuche es später nochmal.';
                btn.textContent    = 'Nachricht senden';
                btn.disabled       = false;
            });
        }
    </script>
</body>
</html>
